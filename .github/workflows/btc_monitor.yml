name: BTC Quant Lab Cloud Monitor

on:
  schedule:
    # Run every 5 minutes (aligned with 5m candle closes; unlimited free minutes on public repo)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web
    inputs:
      notify_status:
        description: 'Send 5m candle close status report to Telegram'
        required: false
        default: 'false'

concurrency:
  group: btc-cloud-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloud Monitor (Model C 40/40 Hybrid & 2h -4.5% 2.5x Dip)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NOTIFY_STATUS: ${{ github.event.inputs.notify_status }}
        run: |
          python cloud_bot.py

      - name: Commit and push state if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_trading_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update paper trading state [skip ci]" && git pull --rebase origin main && git push origin main)
